<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 16-07-2023</title>
    <style>
        /* 1. Reseteo básico y modelo de caja */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 2. Configuración general del cuerpo de la página */
        body {
            background-color: #948a8a;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }

        /* 3. Estilos del encabezado (Header) */
        header {
            background-color: #ffffff;
            padding: 1rem 2rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            font-size: 1.5rem;
            color: #2c3e50;
        }

        header h1 span {
            font-size: 2rem;
            color: #2c5031;
        }

        /* 4. Contenedor principal alineado al centro */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* 5. Tarjeta del formulario de contacto */
        .form-section {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
        }

        .form-section h2 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
            font-size: 1.4rem;
        }

        /* 6. Estilos de los campos del formulario */
        .form-group {
            margin-bottom: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-weight: bold;
            font-size: 0.9rem;
            color: #2c3e50;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2c3e50;
        }

        /* 7. Botones de acción (Enviar y Limpiar) */
        .buttons-group {
            display: flex;
            gap: 15px;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.7rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit {
            background-color: #2c3e50;
        }

        .btn-submit:hover {
            background-color: #1a252f;
        }

        .btn-reset {
            background-color: #e74c3c;
        }

        .btn-reset:hover {
            background-color: #c0392b;
        }

        /* 8. Pie de página (Footer) */
        footer {
            background-color: #2c3e50;
            color: #ffffff;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <!-- Encabezado de la página -->
    <header>
        <h1>Practica <span>16-07-2023</span></h1>
    </header>

    <!-- Contenido principal con la tarjeta del formulario -->
    <main>
        <section class="form-section">
            <h2>Formulario de Contacto</h2>

            <form>
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre">
                </div>

                <div class="form-group">
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad">
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha nacimientos:</label>
                    <input type="date" id="fecha" name="fecha">
                </div>

                <div class="form-group">
                    <label for="pais">Pais:</label>
                    <select id="pais" name="pais">
                        <option value="" disabled selected>Seleccione un país</option>
                        <option value="SV">El Salvador</option>
                        <option value="MX">México</option>
                        <option value="GT">Guatemala</option>
                        <option value="ES">España</option>
                    </select>
                </div>

                <div class="buttons-group">
                    <button type="submit" class="btn btn-submit">Enviar</button>
                    <button type="reset" class="btn btn-reset">Limpiar</button>
                </div>
            </form>
        </section>
    </main>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2023 Mi Sitio Web. Todos los derechos reservados.</p>
    </footer>

</body>

</html>
